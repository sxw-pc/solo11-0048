# A deliberately strict contract; the default fixtures are expected to fail.
version: 1
generated_at: "2025-01-01T00:00:00Z"

defaults:
  period_ms: 1000
  jitter_abs_ms: 5
  jitter_rel: 0.005
  max_gap_points: 2
  max_gap_ratio: 0.01
  fail_jitter_ratio: 0.02
  max_parse_error_ratio: 0.01
  monotonic: true
  duplicate_policy: mark
  merge_gap_points: 1
  drift_window: 64
  drift_threshold_rel: 0.005
  downsample_threshold: 0.2
  histogram_buckets: [5, 10, 25, 50, 100, 250]
  source_column: source
  source_field: source
  timestamp:
    column: ts
    unit: ms
    format: epoch
    tz: UTC

sources:
  - name: mock-sensor-a
    match:
      filename: "mock-sensor-a.csv"
      value: mock-sensor-a

  - name: mock-sensor-b
    match:
      filename: "mock-sensor-b.jsonl"
      value: mock-sensor-b
    period_ms: 500
    timestamp:
      column: ts
      unit: us
      format: epoch
      tz: UTC

  - name: mock-sensor-c
    match:
      filename: "mock-sensor-c.csv"
      value: mock-sensor-c
    period_ms: 2000
    drift_threshold_rel: 0.005
    timestamp:
      column: ts
      unit: ms
      format: iso8601
      tz: UTC
