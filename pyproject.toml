[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jitterlens"
version = "0.1.0"
description = "Offline sampling-jitter and resampling-contract verifier"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jitterlens contributors" }]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
test = ["pytest>=7"]

[project.scripts]
jitterlens = "jitterlens.cli:main"

[tool.setuptools.packages.find]
include = ["jitterlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
